<svg width="100%" height="300" viewBox="0 0 800 300" xmlns="http://w3.org" xmlns:xlink="http://w3.org">
  <defs>
    <!-- animated gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a2e">
        <animate attributeName="stop-color" values="#0a0a2e;#1a1a4e;#0a0a2e" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#1a1a4e">
        <animate attributeName="stop-color" values="#1a1a4e;#2a2a6e;#1a1a4e" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0a0a2e">
        <animate attributeName="stop-color" values="#0a0a2e;#1a1a4e;#0a0a2e" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <!-- glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- another filter for outer glow -->
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- pattern for subtle dots -->
    <pattern id="dotPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.1">
        <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
      </circle>
    </pattern>
  </defs>

  <!-- Background rect with gradient and pattern overlay -->
  <rect width="800" height="300" fill="url(#bgGrad)" />
  <rect width="800" height="300" fill="url(#dotPattern)" />

  <!-- Decorative animated elements (code brackets) -->
  <g opacity="0.15">
    <text x="50" y="250" font-family="'Fira Code', monospace" font-size="80" fill="#ffffff">
      &lt;
      <animate attributeName="y" values="250;230;250" dur="4s" repeatCount="indefinite" />
    </text>
    <text x="700" y="250" font-family="'Fira Code', monospace" font-size="80" fill="#ffffff">
      /&gt;
      <animate attributeName="y" values="250;270;250" dur="4s" repeatCount="indefinite" />
    </text>
  </g>

  <!-- Floating circles -->
  <circle cx="100" cy="50" r="4" fill="#FF6584" opacity="0.8">
    <animate attributeName="cy" values="50;20;50" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="700" cy="80" r="6" fill="#6C63FF" opacity="0.6">
    <animate attributeName="cy" values="80;40;80" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="400" cy="30" r="3" fill="#00F7FF" opacity="0.7">
    <animate attributeName="cy" values="30;10;30" dur="2.8s" repeatCount="indefinite" />
  </circle>

  <!-- Name with glow -->
  <text x="400" y="110" text-anchor="middle" font-family="'Segoe UI', 'Fira Code', sans-serif" font-size="52" font-weight="bold" fill="#ffffff" filter="url(#glow)">
    Hi 👋, I'm Pawan Kumar
  </text>

  <!-- Typing animation image embedded, placed below name -->
  <image x="200" y="150" width="400" height="50" xlink:href="https://herokuapp.com" />
</svg>
